<script>
  // ====== CONFIGURAÇÃO ======
  window.ABUSE = {
    PIXEL_ID: "SEU_PIXEL_ID_AQUI", // <-- troque pelo ID do Pixel (mesmo de META_PIXEL_ID no Netlify)
    WHATSAPP_URL: "https://chat.whatsapp.com/Buj6L9M8To7E3rq1ghlZ1Z?s=cl&p=i&mlu=4&ilr=4&iam=2",
    CAPI_ENDPOINT: "/api/capi"
  };

  // ====== IDENTIFICADORES (fbp / fbc / external_id) ======
  (function () {
    function getCookie(n) {
      var m = document.cookie.match("(^|;)\\s*" + n + "=([^;]*)");
      return m ? decodeURIComponent(m[2]) : null;
    }
    function setCookie(n, v, days) {
      var d = new Date(); d.setTime(d.getTime() + days * 864e5);
      document.cookie = n + "=" + encodeURIComponent(v) + ";expires=" + d.toUTCString() + ";path=/;SameSite=Lax" + (location.protocol === "https:" ? ";Secure" : "");
    }
    function uid() {
      return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    }

    var params = new URLSearchParams(location.search);
    var fbclid = params.get("fbclid");
    var fbc = getCookie("_fbc");
    if (fbclid && (!fbc || fbc.split(".").pop() !== fbclid)) {
      fbc = "fb.1." + Date.now() + "." + fbclid;
      setCookie("_fbc", fbc, 90);
    }
    var fbp = getCookie("_fbp");
    if (!fbp) {
      fbp = "fb.1." + Date.now() + "." + Math.floor(Math.random() * 1e10);
      setCookie("_fbp", fbp, 90);
    }
    var ext = getCookie("abuse_vid");
    if (!ext) { ext = uid(); setCookie("abuse_vid", ext, 365); }

    window.ABUSE.ids = { fbc: fbc, fbp: fbp, external_id: ext };
    window.ABUSE.uid = uid;

    // Envia evento para a CAPI (servidor) com o mesmo event_id do Pixel => deduplicação
    window.ABUSE.capi = function (eventName, eventId, customData) {
      var ids = window.ABUSE.ids;
      var body = JSON.stringify({
        event_name: eventName,
        event_id: eventId,
        event_source_url: location.href,
        fbp: getCookie("_fbp") || ids.fbp,
        fbc: getCookie("_fbc") || ids.fbc,
        external_id: ids.external_id,
        custom_data: customData || {}
      });
      try {
        return fetch(window.ABUSE.CAPI_ENDPOINT, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: body, keepalive: true
        }).catch(function () {});
      } catch (e) {
        if (navigator.sendBeacon) navigator.sendBeacon(window.ABUSE.CAPI_ENDPOINT, new Blob([body], { type: "application/json" }));
        return Promise.resolve();
      }
    };
  })();
</script>

<script>
  (function () {
    var btn = document.getElementById("cta");
    var clicked = false;
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      var url = window.ABUSE.WHATSAPP_URL;
      if (clicked) { location.href = url; return; }
      clicked = true;
      btn.setAttribute("aria-busy", "true");

      var leadId = "lead." + window.ABUSE.uid();
      var data = { content_name: "Grupo WhatsApp Abuse" };
      try { fbq('track', 'Lead', data, { eventID: leadId }); } catch (err) {}
      var sent = window.ABUSE.capi('Lead', leadId, data);

      // Redireciona assim que a CAPI responder, ou no máximo em 600ms
      var go = function () { location.href = url; };
      var timer = setTimeout(go, 600);
      Promise.resolve(sent).then(function () { clearTimeout(timer); go(); });
    });
  })();
</script>
