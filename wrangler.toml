# Deploy alternativo via Cloudflare Workers (o padrão é Netlify — ver netlify.toml)
name = "abusegrupo"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
META_PIXEL_ID = "723038699406275"
# META_CAPI_TOKEN: use `npx wrangler secret put META_CAPI_TOKEN` (não coloque aqui)
